name: Validate reusable foundation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore pinned Power Platform CLI
        run: dotnet tool restore
      - name: Check and test provisioning
        run: npm run check && npm test
      - name: Test registrar authorization and transitions
        shell: pwsh
        run: .\scripts\Test-RegistrarPlugin.ps1
      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $parseErrors = @()
          Get-ChildItem scripts -Filter '*.ps1' | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            $parseErrors += $errors
          }
          if ($parseErrors.Count) {
            $parseErrors | Format-List
            exit 1
          }
      - name: Validate and package reviewed source
        shell: pwsh
        run: .\scripts\Build-Solution.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: MicrosoftTrustedCustomer-foundation
          path: artifacts\build\*.zip
          if-no-files-found: error
